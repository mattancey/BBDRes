name: Build macOS
 
on:
  push:
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
 
      - name: Tester la DSP
        run: |
          clang++ -std=c++17 -O2 -o dsp_test Tests/ResonatorTest.cpp
          ./dsp_test
 
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
 
      - name: Compiler
        run: cmake --build build --config Release --parallel 4
 
      - name: Préparer le paquet
        run: |
          mkdir -p dist
          find build -type d -name "*.vst3" -exec cp -R {} dist/ \;
          find build -type d -name "*.component" -exec cp -R {} dist/ \;
          for f in dist/*; do codesign --force --deep -s - "$f"; done
          ls -la dist
          cd dist && zip -ry ../plugin.zip . && cd ..
 
      - name: Publier le résultat
        uses: actions/upload-artifact@v6
        with:
          name: BBDResV2-macOS
          path: plugin.zip
 
